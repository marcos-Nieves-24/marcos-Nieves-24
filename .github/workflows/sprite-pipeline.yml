name: Sprite Foundry CI

on:
  push:
    paths:
      - "tools/sprites/**"
      - "sprites/**"
      - ".github/workflows/sprite-pipeline.yml"
  pull_request:
    paths:
      - "tools/sprites/**"
      - "sprites/**"
      - ".github/workflows/sprite-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprite-foundry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/sprites/requirements-ci.txt
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y imagemagick
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r tools/sprites/requirements-ci.txt
      - name: Run unit tests
        run: python -m unittest discover -s tools/sprites/tests -v
      - name: Compile Python sources
        run: python -m compileall -q tools/sprites
      - name: Verify generated assets
        run: python tools/sprites/verify.py --all --check-only --skip-aseprite
      - name: Check diff whitespace
        run: git diff --check
