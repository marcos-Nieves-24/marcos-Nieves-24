<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Specimen archive — InVitro-Code</title>
  <desc id="desc">A glass bio-capsule containing the InVitro-Code project, with cultivated plants, glowing cells and integrated project labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c14"/>
      <stop offset="0.55" stop-color="#111126"/>
      <stop offset="1" stop-color="#07201d"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caffef" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#5de4ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#9eff8a" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#effff4"/>
      <stop offset="0.2" stop-color="#9eff8a"/>
      <stop offset="1" stop-color="#35d9c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7ff9a"/>
      <stop offset="1" stop-color="#0b8f78"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5de4ff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="noise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="9" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.13"/></feComponentTransfer>
    </filter>
    <clipPath id="frame"><rect width="1200" height="520" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="520" fill="url(#bg)"/>
    <rect width="1200" height="520" fill="url(#grid)"/>
    <rect width="1200" height="520" filter="url(#noise)" opacity="0.48"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="54" y="58" fill="#9eff8a" font-size="14" letter-spacing="4">SPECIMEN ARCHIVE // 02</text>
      <text x="1146" y="58" text-anchor="end" fill="#8aa7a8" font-size="12" letter-spacing="2">CAPSULE 001</text>
      <path d="M54 78h1092" stroke="#5de4ff" stroke-opacity="0.22"/>
    </g>

    <rect x="54" y="112" width="1092" height="300" rx="150" fill="url(#capsule)" stroke="#b8fff0" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="74" y="132" width="1052" height="260" rx="130" fill="#071218" fill-opacity="0.34" stroke="#5de4ff" stroke-opacity="0.16"/>

    <path d="M1146 164v196M1146 164c44 22 44 150 0 196" fill="none" stroke="#9eff8a" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M54 164v196M54 164c-44 22-44 150 0 196" fill="none" stroke="#ff4fa3" stroke-opacity="0.35" stroke-width="2"/>

    <g transform="translate(270 262)">
      <circle r="104" fill="url(#core)" opacity="0.28" filter="url(#softGlow)"/>
      <circle r="82" fill="none" stroke="#5de4ff" stroke-opacity="0.32" stroke-dasharray="3 9"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5.4s" repeatCount="indefinite"/>
        <rect x="-38" y="-64" width="76" height="52" rx="18" fill="#20343a" stroke="#b8fff0" stroke-opacity="0.65" stroke-width="2"/>
        <rect x="-27" y="-48" width="54" height="22" rx="9" fill="#071116" stroke="#5de4ff" stroke-opacity="0.4"/>
        <circle cx="-14" cy="-37" r="4" fill="#9eff8a" filter="url(#glow)"/>
        <circle cx="14" cy="-37" r="4" fill="#9eff8a" filter="url(#glow)"/>
        <path d="M0-64v-18" stroke="#9db8b5" stroke-width="3"/>
        <path d="M0-82c-16-2-24-12-22-28 16 2 24 12 22 28z" fill="url(#leaf)"/>
        <path d="M-30-8h60l16 66-22 18h-48l-22-18z" fill="#10282a" fill-opacity="0.8" stroke="#b8fff0" stroke-opacity="0.5" stroke-width="2"/>
        <circle cx="0" cy="30" r="24" fill="#9eff8a" opacity="0.7" filter="url(#glow)"/>
        <circle cx="0" cy="30" r="9" fill="#effff4"/>
        <path d="M0 30c-18-14-30-2-30 12s18 20 30 4 18-22 30-10-2 28-22 24" fill="none" stroke="#5de4ff" stroke-width="2"/>
        <path d="M-30-2c-24 10-34 28-36 46M30-2c24 10 34 28 36 46" fill="none" stroke="#9eff8a" stroke-width="3" stroke-linecap="round"/>
        <path d="M-66 44c-22-2-34-12-40-28 22 2 34 12 40 28zM66 44c22-2 34-12 40-28-22 2-34 12-40 28z" fill="url(#leaf)"/>
      </g>
    </g>

    <g fill="#9eff8a" opacity="0.7">
      <circle cx="166" cy="188" r="5">
        <animate attributeName="cy" values="350;150;350" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="372" cy="330" r="4">
        <animate attributeName="cy" values="360;140;360" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="208" cy="300" r="3">
        <animate attributeName="cy" values="340;170;340" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(470 162)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="0" y="0" fill="#8aa7a8" font-size="11" letter-spacing="3">SPECIMEN 001 / EDUCATION SYSTEMS</text>
      <text x="0" y="58" fill="#f1fff7" font-size="46" font-weight="700" letter-spacing="3">INVITRO-CODE</text>
      <text x="0" y="98" fill="#5de4ff" font-size="17" letter-spacing="1">AI + MACHINE LEARNING FOR BIOTECHNOLOGY</text>

      <g transform="translate(0 132)">
        <rect width="122" height="38" rx="19" fill="#122a25" stroke="#9eff8a" stroke-opacity="0.45"/>
        <text x="61" y="24" text-anchor="middle" fill="#9eff8a" font-size="12" letter-spacing="2">NEXT.JS</text>
        <rect x="134" width="112" height="38" rx="19" fill="#122a25" stroke="#9eff8a" stroke-opacity="0.45"/>
        <text x="190" y="24" text-anchor="middle" fill="#9eff8a" font-size="12" letter-spacing="2">PYODIDE</text>
        <rect x="258" width="112" height="38" rx="19" fill="#122a25" stroke="#9eff8a" stroke-opacity="0.45"/>
        <text x="314" y="24" text-anchor="middle" fill="#9eff8a" font-size="12" letter-spacing="2">FASTAPI</text>
        <rect x="382" width="124" height="38" rx="19" fill="#122a25" stroke="#9eff8a" stroke-opacity="0.45"/>
        <text x="444" y="24" text-anchor="middle" fill="#9eff8a" font-size="12" letter-spacing="2">SUPABASE</text>
      </g>

      <g transform="translate(0 204)">
        <circle cx="5" cy="5" r="5" fill="#9eff8a" filter="url(#glow)"/>
        <text x="20" y="10" fill="#9eff8a" font-size="12" letter-spacing="2">LIVE CULTURE</text>
        <text x="220" y="10" fill="#8aa7a8" font-size="12" letter-spacing="2">37 TESTS / &gt;90% COVERAGE</text>
        <text x="520" y="10" fill="#ff4fa3" font-size="12" letter-spacing="2">OPEN SPECIMEN &gt;</text>
      </g>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8aa7a8" font-size="11" letter-spacing="2">
      <text x="54" y="464">BIO//CORE</text>
      <text x="1146" y="464" text-anchor="end">ARCHIVE STATUS: STABLE</text>
    </g>
  </g>
</svg>
