<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">BIO//CORE culture vessel — Marcos Alvarez</title>
  <desc id="desc">A translucent bioreactor robot with glowing cells, root-like circuits and cultivated plants inside a dark futuristic greenhouse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="0.55" stop-color="#111126"/>
      <stop offset="1" stop-color="#071a1c"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#effff4"/>
      <stop offset="0.18" stop-color="#9eff8a"/>
      <stop offset="0.52" stop-color="#35d9c2"/>
      <stop offset="1" stop-color="#35d9c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bffff1" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#5de4ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e8e2"/>
      <stop offset="0.35" stop-color="#6f8586"/>
      <stop offset="1" stop-color="#26363e"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7ff9a"/>
      <stop offset="0.45" stop-color="#54e38b"/>
      <stop offset="1" stop-color="#0b756c"/>
    </linearGradient>
    <linearGradient id="vine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9eff8a"/>
      <stop offset="1" stop-color="#2bc7c9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#5de4ff" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#5de4ff" fill-opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="organicNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="620" rx="32"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="620" fill="url(#bg)"/>
    <rect width="1200" height="620" fill="url(#grid)"/>
    <rect width="1200" height="620" filter="url(#organicNoise)" opacity="0.55"/>

    <g fill="none" stroke="#5de4ff" stroke-opacity="0.12">
      <path d="M460 620V210C460 94 552 20 680 20s220 74 220 190v410"/>
      <path d="M500 620V222C500 122 578 58 680 58s180 64 180 164v398"/>
      <path d="M90 620V300C90 178 172 92 286 92"/>
      <path d="M1110 620V268C1110 148 1034 70 930 70"/>
    </g>

    <g opacity="0.28" fill="#9eff8a">
      <circle cx="1060" cy="110" r="70" filter="url(#softGlow)"/>
      <circle cx="520" cy="410" r="90" filter="url(#softGlow)"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="70" y="82" fill="#9eff8a" font-size="15" letter-spacing="4">CULTURE VESSEL // 00</text>
      <path d="M70 104h190" stroke="#9eff8a" stroke-opacity="0.55"/>
      <text x="70" y="190" fill="#f1fff7" font-size="58" font-weight="700" letter-spacing="5">MARCOS</text>
      <text x="70" y="252" fill="#f1fff7" font-size="58" font-weight="700" letter-spacing="5">ALVAREZ</text>
      <text x="74" y="298" fill="#5de4ff" font-size="18" letter-spacing="3">SOFTWARE FOR BIOLOGY</text>

      <g transform="translate(74 350)">
        <rect width="330" height="118" rx="18" fill="#0c151d" fill-opacity="0.72" stroke="#5de4ff" stroke-opacity="0.28"/>
        <text x="22" y="32" fill="#8aa7a8" font-size="12" letter-spacing="2">CULTIVATION FOCUS</text>
        <text x="22" y="62" fill="#e9fff2" font-size="18">BIOTECHNOLOGY</text>
        <text x="22" y="88" fill="#e9fff2" font-size="18">MACHINE LEARNING</text>
        <circle cx="296" cy="32" r="5" fill="#9eff8a">
          <animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/>
        </circle>
        <path d="M22 102h86" stroke="#ff4fa3" stroke-width="3" stroke-linecap="round"/>
      </g>

      <text x="74" y="516" fill="#8aa7a8" font-size="12" letter-spacing="2">ORGANIC SYSTEMS / REPRODUCIBLE ML / EDGE COMPUTING</text>
      <text x="74" y="548" fill="#5de4ff" font-size="12" letter-spacing="2">STATUS: VIABLE</text>
    </g>

    <g>
      <ellipse cx="822" cy="548" rx="210" ry="34" fill="#000" opacity="0.38"/>
      <ellipse cx="822" cy="548" rx="150" ry="20" fill="#35d9c2" opacity="0.12" filter="url(#softGlow)"/>

      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="6s" repeatCount="indefinite"/>

        <path d="M748 492l-34 76h58l22-76M856 492l28 76h-58l-20-76" fill="url(#metal)" stroke="#9db8b5" stroke-opacity="0.5" stroke-width="2"/>
        <path d="M714 568h58M872 568h58" stroke="#5de4ff" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

        <path d="M676 278h242l38 206-58 36H700l-54-36z" fill="url(#glass)" stroke="#a8fff0" stroke-opacity="0.55" stroke-width="2"/>
        <path d="M704 304h186l28 158-42 28H716l-38-28z" fill="#071318" fill-opacity="0.58" stroke="#5de4ff" stroke-opacity="0.25"/>

        <circle cx="798" cy="392" r="74" fill="url(#core)" opacity="0.85" filter="url(#glow)">
          <animate attributeName="r" values="68;78;68" dur="4.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="798" cy="392" r="30" fill="#eafff3" opacity="0.9">
          <animate attributeName="opacity" values="0.65;1;0.65" dur="3.2s" repeatCount="indefinite"/>
        </circle>

        <g fill="none" stroke="url(#vine)" stroke-width="3" stroke-linecap="round">
          <path d="M798 392c-38-42-70-24-92 10s-18 70 18 92 82 12 104-24 26-82-12-104-76 4-88 38"/>
          <path d="M798 392c44-30 82-6 92 34s-10 78-48 90-76-10-82-44 4-68 42-80"/>
          <path d="M742 354c-10-34 4-58 32-70M854 354c18-30 42-40 70-34M738 454c-30 8-50 30-54 58M866 452c28 12 44 34 46 60"/>
        </g>

        <g fill="#9eff8a">
          <circle cx="706" cy="404" r="5"/>
          <circle cx="890" cy="426" r="6"/>
          <circle cx="774" cy="284" r="4"/>
          <circle cx="850" cy="320" r="5"/>
          <circle cx="684" cy="512" r="4"/>
        </g>

        <path d="M742 260h112l18 48H724z" fill="url(#metal)" stroke="#c8d8d4" stroke-opacity="0.45"/>
        <path d="M772 244h52v28h-52z" fill="#33484d" stroke="#9db8b5" stroke-opacity="0.5"/>

        <rect x="704" y="126" width="188" height="122" rx="42" fill="url(#glass)" stroke="#b8fff0" stroke-opacity="0.62" stroke-width="2"/>
        <rect x="724" y="154" width="148" height="58" rx="24" fill="#071116" stroke="#5de4ff" stroke-opacity="0.35"/>
        <g fill="#9eff8a" filter="url(#glow)">
          <circle cx="758" cy="183" r="8">
            <animate attributeName="opacity" values="1;0.15;1" dur="4.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="838" cy="183" r="8">
            <animate attributeName="opacity" values="1;0.15;1" dur="4.2s" repeatCount="indefinite"/>
          </circle>
        </g>
        <path d="M798 128v-38" stroke="#9db8b5" stroke-width="4"/>
        <path d="M798 92c-22-4-34-18-30-38 22 2 34 16 30 38z" fill="url(#leaf)">
          <animateTransform attributeName="transform" type="rotate" values="-3 798 92;3 798 92;-3 798 92" dur="5.6s" repeatCount="indefinite"/>
        </path>

        <path d="M676 300c-44 18-70 56-76 104l58 18 42-78M918 300c44 18 70 56 76 104l-58 18-42-78" fill="url(#glass)" stroke="#a8fff0" stroke-opacity="0.45" stroke-width="2"/>
        <circle cx="602" cy="410" r="22" fill="url(#metal)" stroke="#9db8b5" stroke-opacity="0.5"/>
        <circle cx="994" cy="410" r="22" fill="url(#metal)" stroke="#9db8b5" stroke-opacity="0.5"/>

        <g>
          <animateTransform attributeName="transform" type="rotate" values="-2 660 320;2 660 320;-2 660 320" dur="7.2s" repeatCount="indefinite"/>
          <path d="M660 324c-38-28-62-70-54-112M656 356c-56 2-94-20-116-58M650 286c-20-34-18-66 4-92" fill="none" stroke="url(#vine)" stroke-width="4" stroke-linecap="round"/>
          <path d="M606 212c-34-4-54-24-58-54 34 4 54 24 58 54zM540 298c-30 0-52-14-64-38 30 0 52 14 64 38zM654 194c-24-16-34-40-28-68 24 16 34 40 28 68z" fill="url(#leaf)"/>
        </g>

        <g>
          <animateTransform attributeName="transform" type="rotate" values="2 940 320;-2 940 320;2 940 320" dur="6.4s" repeatCount="indefinite"/>
          <path d="M940 324c38-28 62-70 54-112M944 356c56 2 94-20 116-58M950 286c20-34 18-66-4-92" fill="none" stroke="url(#vine)" stroke-width="4" stroke-linecap="round"/>
          <path d="M994 212c34-4 54-24 58-54-34 4-54 24-58 54zM1060 298c30 0 52-14 64-38-30 0-52 14-64 38zM946 194c24-16 34-40 28-68-24 16-34 40-28 68z" fill="url(#leaf)"/>
        </g>
      </g>

      <g fill="#9eff8a" filter="url(#glow)">
        <circle cx="560" cy="150" r="4">
          <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 40;-20 90;20 130" dur="9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1030" cy="180" r="3">
          <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 20;30 70;-10 120" dur="11s" repeatCount="indefinite"/>
        </circle>
        <circle cx="980" cy="90" r="5">
          <animate attributeName="opacity" values="0;0.8;0" dur="8s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;-40 80;10 150" dur="12s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g transform="translate(1040 350)">
        <ellipse cx="0" cy="22" rx="28" ry="8" fill="#5de4ff" opacity="0.18"/>
        <path d="M-18 0h36l-6 18h-24z" fill="#20383d" stroke="#5de4ff" stroke-opacity="0.6"/>
        <circle cx="-12" cy="-12" r="10" fill="none" stroke="#9eff8a" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" values="0 -12 -12;360 -12 -12" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="12" cy="-12" r="10" fill="none" stroke="#ff4fa3" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" values="0 12 -12;-360 12 -12" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="-30" r="5" fill="#9eff8a" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="4.5s" repeatCount="indefinite" additive="sum"/>
      </g>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8aa7a8" font-size="11" letter-spacing="2">
      <text x="1010" y="582">BIO//CORE</text>
      <text x="1010" y="600">SPECIMEN 000</text>
    </g>
  </g>
</svg>
